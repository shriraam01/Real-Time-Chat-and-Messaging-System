<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat WebSocket Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
  textarea, input { width: 100%; box-sizing: border-box; padding: 8px; margin: 4px 0 8px; font-family: inherit; }
  .row { display: flex; gap: 8px; }
  .row input { margin: 4px 0 8px; }
  #conversationId { flex: 0 0 110px; }
  button { padding: 8px 14px; cursor: pointer; }
  #status { margin-left: 8px; font-weight: 600; }
  #log { border: 1px solid #8884; border-radius: 6px; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; }
  .err { color: #c0392b; }
  .ok { color: #1e8449; }
</style>
</head>
<body>
<h2>Chat WebSocket test client</h2>
<p>Paste a JWT from <code>/api/auth/login</code>, connect, then send a message to a conversation id you belong to.
Open this page in two tabs with two different users' tokens to see live delivery.</p>

<label for="token">JWT token</label>
<textarea id="token" rows="3" placeholder="eyJhbGciOi..."></textarea>
<div>
  <button id="connectBtn">Connect</button>
  <button id="disconnectBtn" disabled>Disconnect</button>
  <span id="status">Disconnected</span>
</div>

<hr>

<div class="row">
  <input id="conversationId" type="number" placeholder="Conversation id">
  <input id="content" type="text" placeholder="Type a message and press Enter">
  <button id="sendBtn" disabled>Send</button>
</div>

<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
  let client = null;
  const el = id => document.getElementById(id);

  function log(text, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = new Date().toLocaleTimeString() + '  ' + text;   // textContent: never renders HTML
    el('log').appendChild(line);
    el('log').scrollTop = el('log').scrollHeight;
  }

  function setConnected(connected) {
    el('status').textContent = connected ? 'Connected' : 'Disconnected';
    el('connectBtn').disabled = connected;
    el('disconnectBtn').disabled = !connected;
    el('sendBtn').disabled = !connected;
  }

  el('connectBtn').onclick = () => {
    const token = el('token').value.trim();
    if (!token) { log('Paste a token first', 'err'); return; }

    const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    client = new StompJs.Client({
      brokerURL: scheme + location.host + '/ws',
      connectHeaders: { Authorization: 'Bearer ' + token },
      reconnectDelay: 0,
      onConnect: () => {
        setConnected(true);
        log('Connected', 'ok');

        client.subscribe('/user/queue/messages', frame => {
          const m = JSON.parse(frame.body);
          log('[conversation ' + m.conversationId + '] ' + m.senderUsername + ': ' + m.content + '  (' + m.status + ')');
        });

        client.subscribe('/user/queue/errors', frame => {
          log('ERROR: ' + JSON.parse(frame.body).error, 'err');
        });
      },
      onStompError: frame => log('STOMP error: ' + (frame.headers['message'] || frame.body), 'err'),
      onWebSocketError: () => log('WebSocket error (is the server running?)', 'err'),
      onWebSocketClose: () => { setConnected(false); log('Connection closed'); }
    });
    client.activate();
  };

  el('disconnectBtn').onclick = () => { if (client) client.deactivate(); };

  function sendMessage() {
    const conversationId = Number(el('conversationId').value);
    const content = el('content').value;
    if (!conversationId) { log('Enter a conversation id', 'err'); return; }
    client.publish({
      destination: '/app/chat.send',
      body: JSON.stringify({ conversationId: conversationId, content: content })
    });
    el('content').value = '';
  }

  el('sendBtn').onclick = sendMessage;
  el('content').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
